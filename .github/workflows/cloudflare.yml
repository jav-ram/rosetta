name: Cloudflare
# Publishes the app to Cloudflare (Workers with static assets) when the "Version packages" pull request is merged, so the site
# changes only on a release. It can also be started by hand to publish again, or to publish an earlier version (give a tag or a
# commit). Each pull request from this repository is uploaded as a preview version, with its own address, without going live.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to publish (empty: the branch you ran this on)"
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    # Live: the merge commit of the release PR is titled "Version packages (#N)", or someone started it by hand.
    # Preview: only for pull requests from this repository, because the secrets are not given to forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version packages')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || '' }}
      # The app build compiles the Go parser to WebAssembly.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Served from the root of its own address: no base path.
      - run: pnpm --filter @rosetta/app build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/app
          # A pull request is only uploaded as a version (a preview address); the others go live.
          command: ${{ github.event_name == 'pull_request' && 'versions upload' || 'deploy' }}
